name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type checks
        run: pnpm typecheck

      - name: Resolve production D1 binding
        shell: bash
        run: |
          d1_id="$(pnpm --filter @ss/server exec wrangler d1 list --json \
            | jq -r '.[] | select(.name == "ss-reading-nest-db") | .uuid' \
            | head -n 1)"

          if [[ -z "$d1_id" || "$d1_id" == "null" ]]; then
            echo "Could not find D1 database ss-reading-nest-db." >&2
            exit 1
          fi

          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$d1_id/" server/wrangler.jsonc

      - name: Apply D1 migrations
        run: pnpm --filter @ss/server exec wrangler d1 migrations apply ss-reading-nest-db --remote

      - name: Deploy Worker
        run: pnpm deploy:cloudflare
